name: SmartWizz seeded-defect benchmark
on:
  pull_request:
    paths:
      - 'benchmarks/fixtures/**'
      - '.github/workflows/benchmark-review.yml'

jobs:
  smartwizz:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: mycaravam-crypto/smartwizz/.github/workflows/review.yml@main
    with:
      comments: true
    secrets:
      SMARTWIZZ_API_KEY: ${{ secrets.SMARTWIZZ_API_KEY }}
