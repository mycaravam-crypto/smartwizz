# Quality gates for SmartWizz itself. No credentials and no live AI or Azure DevOps calls.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify generated engineering standard
        run: python3 tools/engineering_rules.py --check

      - name: Verify benchmark scoring
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Restore
        run: dotnet restore

      # Whitespace, .editorconfig code style and analyzer fixes must already be applied.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      # Directory.Build.props: analyzers + code style enforced, warnings are errors.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
